        <script>
         	function register(){
         	    
         	   
                //pull the email and username from the inputs on your html page
                var email = document.getElementById("email").value
                var password = document.getElementById("password").value
                
                //save the username by splicing the string before the @ sign
                var username = email.substring(0, email.indexOf("@"))
                //alert(username)  //check if it works, delete or comment this out later
                
                
                //this is firebase code from the documentation
                //it checks the email address and password for the correct format
                //if everything looks good, a user will be created in firebase
                firebase.auth().createUserWithEmailAndPassword(email, password)
                                  .then((userCredential) => {
                                      
                                    //save the username in session storage so it can be used in the chatroom
                                    sessionStorage.setItem("username",username)
                                    //we will use this variable later to validate if the user is logged in
                                    sessionStorage.setItem("loggedIn","yes")
                                      
                                      
                                    // Signed in 
                                    var user = userCredential.user;
                                    window.alert("Thank you, " + username + ", your account has been created!")
                                    
                                    //direct the website to the chatroomPage
                                    window.location="chatroom.html"
                                    // ...
                                  })
                                  .catch((error) => {
                                    var errorCode = error.code;
                                    var errorMessage = error.message;
                                    // ..
                                    window.alert("Error: "+ errorMessage);
                                  });
               }
        </script>
